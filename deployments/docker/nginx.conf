server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their address; the API
        # trusts this proxy through TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 6m;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
