openapi: 3.0.3
info:
  title: Items API
  version: 1.1.0
paths:
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                  note:
                    type: string
                  state:
                    type: string
                    enum: [open, closed, archived]
        "429":
          description: Too many requests
